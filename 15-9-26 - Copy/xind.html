<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- z-index- it controls the order of stacking of elements,the higher
 the valur of an element it will be on the top -->
    <div style="height: 100px;
    width:100px; background-color: red; position: absolute;
    z-index: 1; left: 50px; top: 50px;">
    </div>
    <div style="height: 100px;
    width:100px; background-color: greenyellow; position:absolute;">
    </div>
    <div style="height: 100px;
    width:100px; background-color: blue; position:absolute; 
    left: 100px;top:100px;">
    </div>

</body>
</html>
