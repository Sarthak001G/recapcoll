<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: red;
            width: 100px;
            height: 100px;
        }
        @media(min-width:600px){
            .box{
                background-color: green;
            }
        }
        @media(max-width:900px){
            .box{
                background-color: blue;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    
</body>
</html>
