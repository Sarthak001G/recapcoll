<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #square{
            background-color: red;
            height: 50px;
            width: 50px;
            box-shadow: 10px 5px 44px rgb(129, 9, 9)
        }
        #rectangle{
            background-color: blue;
            height: 50px;
            width: 100px;
            box-shadow: 10px 5px  8px rgb(129, 9, 9)
        }
        #circle{
            background-color: rgb(3, 255, 3);
            height: 50px;
            width: 50px;
            border-radius: 50%;
            box-shadow: 10px 5px 44px rgb(129, 9, 9);
        }


    </style>
</head>
<body>
    <div id="square"></div>
    <br><br>
    <div id="rectangle"></div>
    <br><br>
    <div id="circle"></div>
    
</body>
</html>
