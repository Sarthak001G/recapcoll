<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .new-img{
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIXzxGmcJwNdFCzCBUwY-XZatpEUoiKh4KwgHPNNWzPw&s=10");   
    height:500px;
    width:500px;
    background-position:center;
    background-size:cover;
    /* contain-show the whole image in the div
    cover fills the element background */
    background-repeat:no-repeat;

    }
    </style>
</head>
<body>
    <img height="100px" width="100px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-
    uTj_lEUHOHYWUU18JlCq5KuMw&s=10" alt="">

</body>
</html>
