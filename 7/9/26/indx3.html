<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
</head>
<body>
    <!--Static-->
    <div
    style="height:200px;
    width:200px;
    background-color:aqua; position:relative">
        <div 
        style="height:150px;
        width:150px;
        background-color:rgb(53, 25, 211); position:absolute; bottom:25px; right:25px;">
            <div 
            style="height:100px;
            width:100px;
            background-color:rgb(208, 25, 211); position:absolute; bottom:25px; right:25px;">
                <div 
                style="height:50px;
                width:50px;
                background-color:rgb(211, 25, 25); position:absolute; bottom:25px; right:25px;">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
