<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- content-box sizing excludes the padding ,borders and are applied separately -->
     <!-- border-box sizing includes the padding and borders in the width and height of the element --> 
    <div style="background-color: brown;
    height: 100px;
    width: 100px;
    padding: 4px;
    margin:4px;
    border: 4px solid black;"
    box-sizing: content-box;
</body>
</html>
