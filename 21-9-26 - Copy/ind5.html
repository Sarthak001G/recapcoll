<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .box1{
            height:300px;
            background-color: red;

        .box2{

            background-color: yellow;
        }
        .box3{
            height:300px;
            background-color: green;
        }

    </style>
    <!-- CDN - Content Delivery Network -->
    <!-- CDN helps us to bring prebuilt css utility classes from the bootstrao library into our local project. -->
  </head>
  <body>
    <div class="container">
        <div class="row">
            <div class="col-md-4 box1">A</div>
            <div class="col-md-5 box2">B</div>
            <div class="col-md-3 box3">C</div>
        </div>
    </div>
